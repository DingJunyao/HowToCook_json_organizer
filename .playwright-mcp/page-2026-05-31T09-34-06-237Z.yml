        - heading "Download Notes" [level=4] [ref=e753]
        - list [ref=e754]:
          - listitem [ref=e755]: The Access format has been discontinued as of October 2021. It is recommended to use the new file format, JSON, or to import CSV files from "Full Download of All Data Types" above to replace the tables within the Access format.
          - listitem [ref=e756]: The October 2022 files contain the most recent data. These files were fixed to include some missing fields and were re-released on 12/8/2020.
          - listitem [ref=e757]: The branded food and full download CSV archives from April 2020 to April 2022 have been re-released with corrections to the Nutrient ID column.
          - listitem [ref=e758]: SR Legacy is the final release of the Standard Reference data type. These data will not be updated. Earlier versions of Standard Reference (i.e., SR 17 through 28) are available on the Methods and Application of Food Composition Laboratory (MAFCL) website.
          - listitem [ref=e759]: The Food and Nutrient Database for Dietary Studies (FNDDS) is updated every two years, in conjunction with the two-year cycles of the National Health and Nutri-tion Examination Survey. The October 15, 2020 date represents the date on which FNDDS 2017-2018 was published and made available for download in FoodData Central. Earlier releases can be found on the Food Surveys Research Group website.
          - listitem [ref=e760]: The Full Download file contains files for all of the FoodData Central data types. Therefore, whenever a download for an individual data type is updated, the Full Download file also will be updated to include those new data. The Access file only contains the most recent version of products in the Branded Foods dataset. We recommend you use the API to access previous versions of Branded Food products.
          - listitem [ref=e761]: April 2020* Version 2 includes corrections made on May 1, 2020 to branded foods data.
        - paragraph [ref=e762]:
          - generic [ref=e763]:
            - text: For more information about FoodData Central, go to the
            - link "Frequently Asked Questions" [ref=e764] [cursor=pointer]:
              - /url: /faq
              - text: FAQ
            - text: page.
